    <script>
        document.querySelector("#convert").addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the form from submitting normally
            const form = event.target;
            form.querySelectorAll("button")[0].classList.add("hidden");
            form.querySelectorAll("button")[1].classList.remove("hidden");
            const data = {
                "exchange": selectedExchangeMain.value,
                "network": form.elements.network.value,
                "symbol": form.elements.symbol.value
            };

            console.log(data);

            fetch('/api/v1/deposit/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                console.log(data);
                form.querySelectorAll("button")[0].classList.remove("hidden");
                form.querySelectorAll("button")[1].classList.add("hidden");
                if(data.ok){
                    // Show a success message with SweetAlert
                    swal('Success', data.message, 'success');
                }
                else{
                    // Show an error message with SweetAlert
                    swal('Error', data.message, 'error');
                }
                
            })
            .catch(error => {
                swal('Error', error.message, 'error');
            });
        });

        /**********************************************/$

        selectedExchangeMain.addEventListener("change",async function(){
            get_currecies(this.value)
        })

        async function get_currecies(x){
            let currencies = document.querySelector("#currencies")
            currencies.innerHTML = '<option value=""></option>'
            networks.innerHTML = '<option value=""></option>'
            currencies.setAttribute("disabled","disabled")
            await fetch(`/api/v1/currencies/${x}`)
            .then(res=>res.json())
            .then(res=>{
                console.log(res)
                currencies.removeAttribute("disabled")
                res.forEach(symbol => {
                    console.log(symbol)
                    if (symbol["active"] && symbol["withdraw"]){
                        currencies.insertAdjacentHTML("beforeend",`
                            <option value="${symbol["code"]}">${symbol["code"]}</option>
                        `)

                        //get the values only of the netwrosk array of objects
                        for (const [key, value] of Object.entries(symbol["networks"])) {
                            if(value["active"]&&value["withdraw"]){
                                networks.insertAdjacentHTML("beforeend",`
                                    <option class="hidden" parentCcy="${symbol["code"]}" value="${key}" fee="${value["fee"]}">${key}</option>
                                `)
                            }
                        }
                    }
                });
            })
        }

        get_currecies(selectedExchangeMain.value)

        currencies.addEventListener("change",async function(){
            console.log(this.value)
            networks.querySelectorAll("option").forEach(x=>{
                x.classList.add("hidden")
            });
            console.log([...networks.querySelectorAll("option")].filter(x=>x.getAttribute("parentCcy")==this.value));
            [...networks.querySelectorAll("option")].filter(x=>x.getAttribute("parentCcy")==this.value).forEach((x,i)=>{
                if(i==0){
                    x.selected = true
                }
                x.classList.remove("hidden")
            })
            //document.querySelector("#convert").elements.amount.min = this.selectedOptions[0].getAttribute("min_val")
        })
        
    </script>
