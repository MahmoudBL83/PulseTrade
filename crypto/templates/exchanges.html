{% extends 'base.html' %}
{% block title %}PulseTrade | Exchanges{% endblock %}
{% block head %}
<style>
    .table-responsive22 .card-body{
        overflow: hidden;
        padding: 0!important;
    }
    .table-responsive22 .card-body img{
        position: absolute;
        right: 0;
        top: 0;
        height: calc(100% - 24px);
        width: fit-content;
        border-radius: 0;
        height: calc(100% + 50px)!important;
        transform: translate(50%, -50%);
    }
    .table-responsive22 .card-body:hover img{
        transform: scale(0.5) rotate(2deg) translate(30px, -50px);
        transition: all 0.5s ease-in-out;
    }

    body.light .card > .card-body > div:not(.table-responsive22){
        border: 1px solid #25252517!important;
    }

    body.light .modal-dialog .modal-content{
        background: #ffffff!important;
    }
    
</style>
{% endblock %}
{% block content %}
    <div class="container-fluid content-inner pb-0">
        <img src="/static/images/Hexagon.png" style="position: fixed;top:0;
        left: 0;width: fit-content;height: 100%;filter: grayscale(1);min-height: 100%;min-width: 100%;opacity: 0.08;">   
        <div class="row" id="exchangesCard">
            <div class="col-lg-12">
                <div class="card card-block card-stretch custom-scroll" style="background-color: transparent;box-shadow: unset;">
                    <div class="card-header hidden d-flex flex-wrap justify-content-between align-items-center">
                        <div class="caption" style="display: flex;align-items: center;width: 100%;justify-content: space-between;">
                            <h4 class="font-weight-bold mb-2 multi-lang-text-exchanges"></h4>
                            <div class="form-check form-switch form-check-inline">
                                <input class="form-check-input removeOverlay" type="checkbox" id="take_profit_switch">
                            </div>
                        </div>
                    </div>
                    <div class="card-body" style="padding: 16px;">
                        <div class="table-responsive22 row" style="row-gap:20px">
                            <table class="table data-table mb-0" id="exchangesTable">
                                <!--thead>
                                    <tr>
                                        <th scope="col">Exchange</th>
                                        <th scope="col" style="text-align: end;">Connect</th>
                                    </tr>
                                </thead-->
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Pop-up div for success message -->
        <div class="modal fade" id="successModal" tabindex="-1" role="dialog" aria-labelledby="successModalLabel" aria-hidden="true">
            <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                <h5 class="modal-title multi-lang-text-exchanges" id="successModalLabel">Success!</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                </div>
                <div class="modal-body multi-lang-text-exchanges">
                Your API credentials have been saved successfully.
                </div>
                <div class="modal-footer">
                <button type="button" class="btn btn-secondary multi-lang-text-exchanges" data-dismiss="modal">Close</button>
                </div>
            </div>
            </div>
        </div>
        
      </div>  
    </main>
     
    <!-- Wrapper End-->
    <!-- offcanvas start -->

    <!-- Backend Bundle JavaScript -->
    <script src="/static/assets/js/libs.min.js"></script>
    <!-- widgetchart JavaScript -->
    <script src="/static/assets/js/charts/widgetcharts.js"></script>
    <!-- fslightbox JavaScript -->
    <script src="/static/assets/js/fslightbox.js"></script>
    <!-- app JavaScript -->
    <script src="/static/assets/js/app.js"></script>
    <!-- apexchart JavaScript -->
    <script src="/static/assets/js/charts/apexcharts.js"></script>
    <script src="/static/js/langs/exchanges.js"></script>
    <!-- JavaScript code to handle Save Changes button click -->
    <script>
        document.querySelectorAll(".multi-lang-text-exchanges").forEach(function(element,i){
            element.innerHTML = lang_data_exchanges[localStorage.getItem('lang')][i]
        })
        selectedExchangeMain.parentElement.classList.add("hidden")
        /*$(document).ready(function() {
        $("#saveChangesBtn").click(function() {
            // Perform API key and API secret validation here
            
            // Show success message
            $("#successModal").modal("show");
        });
        });*/
        document.querySelector('#sidebar').querySelectorAll("a.nav-link")[1].classList.add("active")
        connected_exchanges = []
        connected_exchanges2 = []
        '{% for exchange in exchanges %}'
        connected_exchanges.push('{{ exchange.name }}')
        connected_exchanges2.push(['{{ exchange.name }}','{{ exchange.demo|tojson }}'])
        '{% endfor %}'
        console.log(connected_exchanges2)
        exchanges = ['ace', 'alpaca', 'ascendex', 'bequant', 'bigone', 'binance', 'binancecoinm', 'binanceus', 'binanceusdm', 'bit2c', 'bitbank', 'bitbay', 'bitbns', 'bitcoincom', 'bitfinex', 'bitfinex2', 'bitflyer', 'bitforex', 'bitget', 'bithumb', 'bitmart', 'bitmex', 'bitopro', 'bitpanda', 'bitrue', 'bitso', 'bitstamp', 'bitstamp1', 'bittrex', 'bitvavo', 'bkex', 'bl3p', 'blockchaincom', 'btcalpha', 'btcbox', 'btcex', 'btcmarkets', 'btctradeua', 'btcturk', 'bybit', 'cex', 'coinbase', 'coinbaseprime', 'coinbasepro', 'coincheck', 'coinex', 'coinfalcon', 'coinmate', 'coinone', 'coinsph', 'coinspot', 'cryptocom', 'currencycom', 'delta', 'deribit', 'digifinex', 'exmo', 'fmfwio', 'gate', 'gateio', 'gemini', 'hitbtc', 'hitbtc3', 'hollaex', 'huobi', 'huobijp', 'huobipro', 'idex', 'independentreserve', 'indodax', 'kraken', 'krakenfutures', 'kucoin', 'kucoinfutures', 'kuna', 'latoken', 'lbank', 'lbank2', 'luno', 'lykke', 'mercado', 'mexc', 'mexc3', 'ndax', 'novadax', 'oceanex', 'okcoin', 'okex', 'okex5', 'okx', 'paymium', 'phemex', 'poloniex', 'poloniexfutures', 'probit', 'tidex', 'timex', 'tokocrypto', 'upbit', 'wavesexchange', 'wazirx', 'whitebit', 'woo', 'xt', 'yobit', 'zaif', 'zonda']
        exchanges = ['okex','binance','bybit','kucoin','coinbase','cryptocom','bittrex']
        exchanges = JSON.parse('{{ exchanges2|tojson }}');
        for (let i = 0; i < exchanges.length; i++) exchanges[i] = exchanges[i]
        colors = ["#ffffff14","#e6b22e1c","#b47d0829","#14664b33","#0057ff1f","#ffffff14","#008eed2b"]
        colors = {
            'okex':'#ffffff14',
            'binance':'#e6b22e1c',
            'bybit':'#b47d0829',
            'kucoin':'#14664b33',
            'coinbase':'#0057ff1f',
            'cryptocom':'#ffffff14',
            'bittrex':'#008eed2b',
        }

        exchanges.forEach((e,i)=>{
            exchangesCard.querySelector(".table-responsive22").insertAdjacentHTML('beforeend',`
            <div class="card shadow-none m-0 col-xs-12 col-md-6 col-lg-4 col-xl-3" style="background: transparent;">

                <div class="card-body p-0 " style="border:0!important;">
                <div href="#" style="border: 0;padding: 12px;background: linear-gradient(-135deg, ${colors[e]}, transparent,transparent);border-radius: 6px;border: 1px solid #ffffff17;border: 0;padding: 12px;background: linear-gradient(-135deg, #e6b22e1c, transparent,transparent);border-radius: 6px;border: 1px solid #ffffff17;border-color: #36363869!important;">
                    <div class="d-flex " style="width: calc(100% + 16px);
                    margin-left: -8px;position: relative;
                    background: transparent;
                    padding: 10px;
                    border-radius: 10px;    margin-bottom: 15px;">
                        <div class=" w-100" style="direction: ltr;">
                            <h3 style="font-style: italic;
                            width: fit-content;
                            padding: 6px;
                            border-radius: 5px;">${e.exchange}</h3>
                            <img src="/static/images/${e.exchange.includes('binance')  ? 'binance' : (e.exchange.includes('bitfinex')  ? 'bitfinex' : (e.exchange.includes('coinbase')  ? 'coinbase' : (e.exchange.includes('okex')  ? 'okex' : (e.exchange.includes('huobi')  ? 'huobi' : (e.exchange.includes('hitbtc')  ? 'hitbtc' : (e.exchange.includes('lbank')  ? 'lbank' : (e.exchange.includes('mexc')  ? 'mexc' : (e.exchange.includes('kraken')  ? 'kraken' : e.exchange))))))))}.svg" style="position: absolute;${e.exchange=='bybit'?'filter:invert(1);':''}" class="img-fluid avatar avatar-30 avatar-rounded" alt="img51">
                        </div>
                    </div>
                    <div class="d-grid gap-card ${JSON.parse(connected_exchanges2.find(([element]) => element === e.exchange)?connected_exchanges2.find(([element]) => element === e.exchange)[1]:'0')?'grid-cols-2':'grid-cols-1'}" style="gap: 8px;">
                        <button style="width:100%;white-space: nowrap;border-color: #36363869!important;" type="button" style="padding-left: 10px;padding-right: 10px;" class="btn ${!connected_exchanges.includes(e.exchange)?"btn-outline-success":"btn-outline-danger"} sc-caiLqq btn-sm" data-toggle="modal"  data-target="${connected_exchanges.includes(e.exchange)?'':'#myModal'+i}"
                            <span id="${connected_exchanges.includes(e.exchange)?'disconnect'+i:''}" class="">
                                ${connected_exchanges.includes(e.exchange)?lang_data_exchanges[localStorage.getItem("lang")][16]:lang_data_exchanges[localStorage.getItem("lang")][15]}
                            </span>
                        </button>
                        ${JSON.parse(connected_exchanges2.find(([element]) => element === e.exchange)?connected_exchanges2.find(([element]) => element === e.exchange)[1]:'0')?`<button class="btn btn-secondary btn-sm" style="width:100%;white-space: nowrap;">${lang_data_exchanges[localStorage.getItem("lang")][17]}</button>`:''}
                    </div>
                </div>
                </div>
                </div>
            `)
        })

        exchanges.forEach((e,i)=>{
            /*exchangesTable.querySelector("tbody").insertAdjacentHTML('beforeend',`
                <tr class="white-space-no-wrap">
                    <td style="${i==0 ? 'border-top: 0;':''}">
                        <img src="/static/images/${e.exchange}.svg" class="img-fluid avatar avatar-30 avatar-rounded" alt="img23" />
                        ${e.exchange}
                    </td>
                    <td style="text-align: end;${i==0 ? 'border-top: 0;':''}">
                    ${connected_exchanges2.find(([element]) => element === e.exchange)?`<button style="padding-top: 4px;padding-bottom: 4px;" type="button" class="btn btn-soft-success btn-disabled">${lang_data_exchanges[localStorage.getItem("lang")][17]}</button>`:''}
                    <button type="button" style="padding-left: 10px;padding-right: 10px;" class="btn ${!connected_exchanges.includes(e.exchange)?"btn-primary":"btn-secondary"} sc-caiLqq btn-sm" data-toggle="modal"  data-target="${connected_exchanges.includes(e.exchange)?'':'#myModal'+i}">
                        <svg width="16px" height="16px" class="svg-icon" viewBox="0 0 16 16" fill="none">
                            <path
                                fill-rule="evenodd"
                                clip-rule="evenodd"
                                d="M2 0.25C1.03379 0.25 0.25 1.03291 0.25 1.9997V4.5C0.25 4.91421 0.585786 5.25 1 5.25C1.41421 5.25 1.75 4.91421 1.75 4.5V1.9997C1.75 1.86192 1.86164 1.75 2 1.75H14C14.1381 1.75 14.25 1.86193 14.25 2V14C14.25 14.1381 14.1381 14.25 14 14.25H2C1.86164 14.25 1.75 14.1381 1.75 14.0003V11.5C1.75 11.0858 1.41421 10.75 1 10.75C0.585786 10.75 0.25 11.0858 0.25 11.5V14.0003C0.25 14.9671 1.03379 15.75 2 15.75H14C14.9665 15.75 15.75 14.9665 15.75 14V2C15.75 1.0335 14.9665 0.25 14 0.25H2ZM6.53033 4.46967C6.23744 4.17678 5.76256 4.17678 5.46967 4.46967C5.17678 4.76256 5.17678 5.23744 5.46967 5.53033L7.18934 7.25H1C0.585786 7.25 0.25 7.58579 0.25 8C0.25 8.41421 0.585786 8.75 1 8.75H7.18934L5.46967 10.4697C5.17678 10.7626 5.17678 11.2374 5.46967 11.5303C5.76256 11.8232 6.23744 11.8232 6.53033 11.5303L9.53033 8.53033L10.0607 8L9.53033 7.46967L6.53033 4.46967Z"
                                fill="currentColor"
                            ></path>
                        </svg>
                        <span id="${connected_exchanges.includes(e.exchange)?'disconnect'+i:''}">${connected_exchanges.includes(e.exchange)?lang_data_exchanges[localStorage.getItem("lang")][16]:lang_data_exchanges[localStorage.getItem("lang")][15]}</span>
                    </button>
                    </td>
                </tr>
            `)*/
            exchangesTable.insertAdjacentHTML('afterend',`
                <!-- Pop-up div with input fields -->
                <div class="modal fade" id="myModal${i}" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
                    <div class="modal-dialog" role="document">
                        <div class="modal-content" style="backdrop-filter: blur(35px);background:${colors[i]};position:relative;overflow:hidden;">
                            <img src="/static/images/${e.exchange}.svg" style="position:absolute;top:50%;transform:translateY(-50%);right:-50%;width:100%;opacity:0.1;height: fit-content;border-radius:0;" class="img-fluid avatar avatar-30 avatar-rounded" alt="img23" />
                            <div class="modal-header">
                                <h5 class="modal-title" id="myModalLabel">${lang_data_exchanges[localStorage.getItem("lang")][8]}</h5>
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                    <span style="color: white;text-shadow: none;" aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            <div class="modal-body">
                                <form method="POST" action="{{ url_for('connect_exchange') }}">
                                    <div class="form-group">
                                        <input style="border: 0;border-radius: 0;border-bottom: 1px solid #ffffff08;background:transparent" type="text" class="form-control" id="apiKey" name="api_key" placeholder="${lang_data_exchanges[localStorage.getItem("lang")][9]}">
                                    </div>
                                    <div class="form-group">
                                        <input style="border: 0;border-radius: 0;border-bottom: 1px solid #ffffff08;background:transparent" type="text" class="form-control" id="apiSecret" name="api_secret" placeholder="${lang_data_exchanges[localStorage.getItem("lang")][10]}">
                                    </div>
                                    <div class="form-group">
                                        <input style="border: 0;border-radius: 0;border-bottom: 1px solid #ffffff08;background:transparent" type="text" class="form-control" id="password" name="password" placeholder="${lang_data_exchanges[localStorage.getItem("lang")][11]}">
                                    </div>
                                    <div class="card-header form-check form-check-block ${(e.test)?'':'hidden'}" id="demo_exchange" style="    margin: 0;margin-bottom: 20px;padding-left: 45px!important;">
                                        <input type="checkbox" class="form-check-input" name="demo" id="customCheck6">
                                        <label class="form-check-label pl-2" for="customCheck6">${lang_data_exchanges[localStorage.getItem("lang")][12]}</label>
                                    </div>
                                    <input type="hidden" name="exchange_name" value="${e.exchange}">
                                    <button type="submit" class="btn btn-secondary saveExchangeBtn">${lang_data_exchanges[localStorage.getItem("lang")][13]}</button>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-dismiss="modal">${lang_data_exchanges[localStorage.getItem("lang")][14]}</button>
                            </div>
                        </div>
                    </div>
                </div>
            `)
            document.querySelector(`#myModal${i}`).addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent the form from submitting normally
                const form = event.target;
                const data = {
                    api_key: form.elements.api_key.value,
                    api_secret: form.elements.api_secret.value,
                    exchange_name: form.elements.exchange_name.value,
                    password: form.elements.password.value,
                    demo:form.elements.demo.checked,
                };
                let oldHTML = this.querySelector(".saveExchangeBtn").innerHTML;
                this.querySelector(".saveExchangeBtn").setAttribute("disabled","disabled")
                let validData = true
                this.querySelector(".saveExchangeBtn").innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span><span class="visually-hidden">Loading...</span>';
                [...[this.querySelector('#apiKey'),this.querySelector('#apiSecret')]].forEach(e=>{
                    if(e.value == ""){
                        e.classList.add("is-invalid")
                        validData = false
                    }
                    else{
                        e.classList.remove("is-invalid")
                    }
                })
                if (validData){
                    fetch('/api/v1/connect/', {
                        method: 'POST',
                        headers: {
                        'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data),
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.ok)
                        // Show a success message with SweetAlert
                        swal('Success', data.message, 'success')
                        .then(() => {
                            localStorage.setItem("fav_exchange",form.elements.exchange_name.value)
                            
                            location.href = "/dashboard/";
                        });
                        else
                        swal('Error', data.message, 'error')
                        /*.then(() => {
                            location.reload();
                        });*/
                    })
                    .catch(error => {
                        // Show an error message with SweetAlert
                        swal('Error', error.message, 'error');
                    })
                    .finally(()=>{
                        this.querySelector(".saveExchangeBtn").removeAttribute("disabled")
                        this.querySelector(".saveExchangeBtn").innerHTML = oldHTML
                    });
                }
                else{
                    this.querySelector(".saveExchangeBtn").removeAttribute("disabled")
                    this.querySelector(".saveExchangeBtn").innerHTML = oldHTML
                }
            });

            

            [...[document.querySelector(`#myModal${i}`).querySelector('#apiKey'),document.querySelector(`#myModal${i}`).querySelector('#apiSecret'),document.querySelector(`#myModal${i}`).querySelector('#password')]].forEach(e=>{
                e.addEventListener("input",function(){
                    if(this.value != ""){
                        this.classList.remove("is-invalid")
                    }
                })
            })

            

            document.querySelector(`#disconnect${i}`)?.addEventListener('click', function(event) {
                event.preventDefault(); // Prevent the form from submitting normally
                const form = this;
                const data = {
                    exchange_name: form.parentElement.parentElement.parentElement.querySelector("h3").textContent.replaceAll(" ","").replaceAll("\n",""),
                };

                swal({
                    title: localStorage.getItem("lang")!='ar' ? "Are you sure?" : "هل أنت متأكد؟",
                    text: localStorage.getItem("lang")!='ar' ? "Once disconnected, you will not be able to connect again without API keys!" : " بمجرد الفصل ، لن تتمكن من الاتصال مرة أخرى دون مفاتيح API!",
                    icon: "warning",
                    buttons: true,
                    dangerMode: true,
                })
                .then(async (willDelete) => {
                    if (willDelete) {
                        fetch('/api/v1/disconnect/', {
                        method: 'POST',
                        headers: {
                        'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data),
                    })
                    .then(response => response.json())
                    .then(data => {
                        // Show a success message with SweetAlert
                        swal('Success', data.message, 'success')
                        .then(() => {
                            location.reload();
                        });
                        
                    })
                    .catch(error => {
                        // Show an error message with SweetAlert
                        swal('Error', error.message, 'error');
                    });
                }
                });
            });
        })

        document.querySelectorAll(".replaceExchange").forEach(e=>{
            e.href = e.href.replace("okex",localStorage.getItem("fav_exchange"))
        })
        

        
    </script>
  </body>
</html>
{% endblock %}
