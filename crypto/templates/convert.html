    <script>
        pairs = JSON.parse('{{pairs|tojson}}')
        console.log(pairs)
        document.querySelectorAll(".multi-lang-text-convert").forEach(function(element,i){
            element.innerHTML = lang_data_convert[localStorage.getItem('lang')][i]
        })
        selectedExchangeMain.parentElement.classList.remove("hidden")
        let canConvert = false
        document.querySelector("#convert").addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the form from submitting normally
            const form = event.target;
            form.querySelectorAll("button")[0].classList.add("hidden");
            form.querySelectorAll("button")[1].classList.remove("hidden");
            const data = {
                "exchange": selectedExchangeMain.value,
                "amount": form.elements.amount.value,
                "order_type": form.elements.order_type.value,
                "source_asset": form.elements.source_asset.value,
                "target_asset": form.elements.target_asset.value,
                "price": form.elements.price.value,
                "side": form.elements.side.value,
            };

            fetch('/api/v1/convert/', {
                method: 'POST',
                headers: {
                'Content-Type': 'application/json'
                },
                body: JSON.stringify(data),
            })
            .then(response => response.json())
            .then(data => {
                
                if(data.ok){
                    // Show a success message with SweetAlert
                    swal(localStorage.getItem("lang")!="ar"?"Success":"تم", data.message, 'success');
                }
                else{
                    // Show an error message with SweetAlert
                    swal(localStorage.getItem("lang")!="ar"?"Error":"خطأ", data.message, 'error');
                }
            })
            .catch(error => {
                // Show an error message with SweetAlert
                swal(localStorage.getItem("lang")!="ar"?"Error":"خطأ", error.message, 'error');
            })
            .finally(() => {
                form.querySelectorAll("button")[0].classList.remove("hidden");
                form.querySelectorAll("button")[1].classList.add("hidden");
            });
        });

        /****************************************************************/
        getPrice()
        async function getPrice(){
            let form = document.querySelector("#convert")
            side_input.value=="1"
            await fetch(`/api/v1/live_price?pair=${form.elements.source_asset.value}&market=${form.elements.target_asset.value}&exchange=${selectedExchangeMain.value.toUpperCase()}&stream=false`)
            .then(res => res.json())
            .then(res=>{
                if(form.elements.order_type.value == 'market'){
                    if(side_input.value=="1")
                    form.elements.amount2.value = res*parseFloat(form.elements.amount.value)

                    else
                    form.elements.amount.value = (parseFloat(form.elements.amount2.value)/res)

                    set_precision()
                }
                if(form.elements.price.value==""){
                    form.elements.price.value = res.toFixed(6)
                }
                //document.querySelector("form").querySelector("button").removeAttribute("disabled")
            })
            .catch(err=>{
                //document.querySelector("form").querySelector("button").setAttribute("disabled","disabled")
                form.elements.amount2.value = ''
                form.elements.amount.value = ''
            })
            .finally(()=>{
                getPrice()
            })
        }

        async function get_precisions(x){
            await fetch(`/api/v1/currencies/${x}`)
            .then(res=>res.json())
            .then(res=>{
                localStorage.setItem("precisions",JSON.stringify(res))
            })
        }

        get_precisions(selectedExchangeMain.value)

        async function get_precision2(x){
            await fetch(`/api/v1/precision/${selectedExchangeMain.value}`,{
                method: 'POST',
                headers: {
                'Content-Type': 'application/json'
                },
                body: JSON.stringify({"symbol":x}),
            })
            .then(res=>res.json())
            .then(res=>{
                localStorage.setItem("precision_json",JSON.stringify(res))
            })
        }

        function get_precision(x){
            return JSON.parse(localStorage.getItem("precision_json"))
        }
        /*async function get_currecies(x){
            document.querySelectorAll(".currencies").forEach(async (element,i) => {
                element.innerHTML = '<option value=""></option>'
                await fetch(`/api/v1/markets/${x}`)
                .then(res=>res.json())
                .then(res=>{
                    element.removeAttribute("disabled")
                    if(i==0)
                    Object.keys(res.quote).forEach(symbol => {
                        element.insertAdjacentHTML("beforeend",`
                            <option ${symbol == 'USDT'?"selected":""} value="${symbol}">${symbol}</option>
                        `)
                    });
                    if(i==1)
                    Object.keys(res.base).forEach(symbol => {
                        element.insertAdjacentHTML("beforeend",`
                            <option ${symbol == selectedPair?"selected":""} value="${symbol}">${symbol}</option>
                        `)
                    });
                })
                .finally(()=>{
                    order_book_history()
                    last_trades_history()
                    live_price_history()
                    indicators()
                })
            });
        }*/

        document.querySelector("#order_type").addEventListener("change",function(){
            let form = document.querySelector("#convert")
            if(this.value=="market"){
                price_input.closest(".col-md-12").classList.add("hidden")
                getPrice()
            }else{
                price_input.closest(".col-md-12").classList.remove("hidden")
                form.elements.amount2.value = price_input.value*form.elements.amount.value
            }
            get_bal2()
        })

        amount_input.addEventListener("input",function(){
            let form = document.querySelector("#convert")
            if(form.elements.order_type.value == 'limit'){
                form.elements.amount2.value = price_input.value*form.elements.amount.value
            }
            
            
        })

        price_input.addEventListener("input",function(){
            let form = document.querySelector("#convert")
            if(form.elements.order_type.value == 'limit'){
                form.elements.amount2.value = this.value*form.elements.amount.value
            }
        })

        /**************************************************/

        selectedExchangeMain.addEventListener("change",async function(){
            get_currecies(this.value)
        })

        async function get_currecies(x){
            document.querySelectorAll(".currencies").forEach(async (element,i) => {
                element.innerHTML = '<option value=""></option>'
                element.setAttribute("disabled","disabled")
                await fetch(`/api/v1/markets/${x}`)
                .then(res=>res.json())
                .then(res=>{
                    element.removeAttribute("disabled")
                    console.log(res)
                    if(i==1)
                    Object.keys(res.quote).forEach(symbol => {
                                element.insertAdjacentHTML("beforeend",`
                                    <option value="${symbol}">${symbol}</option>
                                `)
                    });
                    if(i==0)
                    Object.keys(res.base).forEach(symbol => {
                                element.insertAdjacentHTML("beforeend",`
                                    <option value="${symbol}">${symbol}</option>
                                `)
                    });
                    canConvert = true
                })
            });
            
        }

        get_currecies(selectedExchangeMain.value)
        


        document.querySelector("#convert").querySelector("#convert_svg").addEventListener("click",function(){
            if(canConvert)
            if(side_input.value == "2"){
                let oldValue = source_asset.value
                side_input.value = "1"
                let x = price_input.closest(".row").cloneNode(true)
                let y = source_asset.closest(".row").cloneNode(true)
                price_input.closest(".row").remove()
                source_asset.closest(".row").remove()
                order_type.closest(".row").insertAdjacentElement("afterend",y)
                y.closest(".row").insertAdjacentElement("afterend",x)
                amount_input.parentElement.querySelector("label").innerHTML = "From"
                amount_input2.parentElement.querySelector("label").innerHTML = "To"
                amount_input.removeAttribute("disabled")
                amount_input2.setAttribute("disabled","disabled")
                source_asset.value = oldValue
            }
            else{
                let oldValue = target_asset.value
                side_input.value = "2"
                let x = target_asset.closest(".row").cloneNode(true)
                let y = price_input.closest(".row").cloneNode(true)
                price_input.closest(".row").remove()
                target_asset.closest(".row").remove()
                order_type.closest(".row").insertAdjacentElement("afterend",x)
                x.closest(".row").insertAdjacentElement("afterend",y)
                amount_input.parentElement.querySelector("label").innerHTML = "To"
                amount_input2.parentElement.querySelector("label").innerHTML = "From"
                amount_input.setAttribute("disabled","disabled")
                amount_input2.removeAttribute("disabled")
                target_asset.value = oldValue
            }
            get_bal2()
            set_precision()
        })

        source_asset.addEventListener("change",function(){
            let filtered = pairs.filter(pair => pair.startsWith(this.value+'/'))
            let oldValue = target_asset.value
            target_asset.innerHTML = '<option value=""></option>'
            filtered.forEach(pair => {
                target_asset.insertAdjacentHTML("beforeend",`
                    <option value="${pair.split('/')[1]}">${pair.split('/')[1]}</option>
                `)
            });
            target_asset.value = oldValue
            get_bal2()
            let form = document.querySelector("#convert")
            if(form.elements.target_asset.value && form.elements.source_asset.value)
            get_precision2(form.elements.source_asset.value+"/"+form.elements.target_asset.value)
            set_precision()
        })

        target_asset.addEventListener("change",function(){
            //find pairs that ends with '/this.value'
            let filtered = pairs.filter(pair => pair.endsWith('/'+this.value))
            let oldValue = source_asset.value
            source_asset.innerHTML = '<option value=""></option>'
            filtered.forEach(pair => {
                source_asset.insertAdjacentHTML("beforeend",`
                    <option value="${pair.split('/')[0]}">${pair.split('/')[0]}</option>
                `)
            });
            source_asset.value = oldValue
            get_bal2()
            let form = document.querySelector("#convert")
            if(form.elements.target_asset.value && form.elements.source_asset.value)
            get_precision2(form.elements.source_asset.value+"/"+form.elements.target_asset.value)
            set_precision()
            
        })

        function get_bal2(){
            let symbol = document.querySelector("#convert").elements.side.value=='2'?target_asset.value:source_asset.value
            bal = parseFloat(JSON.parse(localStorage.getItem("balance_json"))[symbol])
            if (bal>0){
                document.querySelector("#bal_percentage").previousElementSibling.classList.remove("hidden")
                document.querySelector("#bal_percentage").innerHTML = `${(parseFloat((side_input.value=='1'? document.querySelector("#convert").elements.amount.value:document.querySelector("#convert").elements.amount2.value)||0)/bal*100).toFixed(12)}%`
            }
            else{
                document.querySelector("#bal_percentage").previousElementSibling.classList.add("hidden")
                document.querySelector("#bal_percentage").innerHTML = localStorage.getItem("lang")!="ar"?'You have 0 of':' لديك 0 من' + ` ${symbol}`
            } 
            
        }


        let bal = null
        async function get_bal(){
            await fetch(`/api/v1/live_balance_json?exchange=${selectedExchangeMain.value}`)
            .then(res=>res.json())
            .then(res=>{
                localStorage.setItem("balance_json",JSON.stringify(res))
                
            })
            .finally(()=>{
                get_bal()
            })
        }
        
        get_bal()

        setInterval(()=>{
            get_bal2()
            if(parseFloat(document.querySelector("#bal_percentage").innerHTML)<=100 && parseFloat(document.querySelector("#bal_percentage").innerHTML)>0 && bal!=null && !document.querySelector("#bal_percentage").previousElementSibling.classList.contains("hidden")){
                //document.querySelector("#convert").querySelectorAll("button")[0].removeAttribute("disabled");
                document.querySelector("#bal_percentage").parentElement.classList.remove("error-card")
            }
            else{
                
                //document.querySelector("#convert").querySelectorAll("button")[0].setAttribute("disabled","disabled");
                document.querySelector("#bal_percentage").parentElement.classList.add("error-card")
            }
            if(!document.querySelector("#bal_percentage").previousElementSibling.classList.contains("hidden")&&side_input.value=="2"){
                document.querySelector("#bal_percentage").innerHTML = `${(parseFloat(document.querySelector("#convert").elements.amount2.value||0)/bal*100).toFixed(12)}%`
            }
            if(!document.querySelector("#bal_percentage").previousElementSibling.classList.contains("hidden")&&side_input.value=="1"){
                document.querySelector("#bal_percentage").innerHTML = `${(parseFloat(document.querySelector("#convert").elements.amount.value||0)/bal*100).toFixed(12)}%`
            }

            if(parseFloat(amount_input.value) > 0 && parseFloat(amount_input2.value) > 0 && source_asset.value && target_asset.value && localStorage.getItem("wrong_precision")=="false"&& localStorage.getItem("wrong_precision2")=="false" &&document.querySelector("#bal_percentage").parentElement.classList.contains("error-card") == false){
                document.querySelector("#convert").querySelectorAll("button")[0].removeAttribute("disabled");
            }
            else{
                
                document.querySelector("#convert").querySelectorAll("button")[0].setAttribute("disabled","disabled");
            }
                
        },100)

        let form = document.querySelector("#convert")
        document.querySelector("#convert").elements.amount.addEventListener("input",function(){
            set_precision()
        })

        document.querySelector("#convert").elements.amount2.addEventListener("input",function(){
            set_precision()
        })

        //make the same when value of amount2 changed from code

        function set_precision(){
            if(JSON.parse(localStorage.getItem("precision_json"))&&form.elements.target_asset.value && form.elements.source_asset.value && form.elements.amount.value && form.elements.amount2.value){
                //let percision_target = JSON.parse(localStorage.getItem("precisions")).filter(x=>x.code==form.elements.target_asset.value)[0].precision
                let percision_target = get_precision(form.elements.source_asset.value+"/"+form.elements.target_asset.value)['amount']
                if(percision_target >= 1){
                    if(parseFloat(parseFloat(form.elements.amount.value).toFixed(percision_target)) == 0){
                        localStorage.setItem("wrong_precision2","true")
                    }
                    else{
                        localStorage.setItem("wrong_precision2","false")
                    }
                }
                else{
                    if(parseFloat(form.elements.amount.value) < percision_target * 10){
                        localStorage.setItem("wrong_precision2","true")
                    }
                    else{
                        localStorage.setItem("wrong_precision2","false")
                    }
                }
                    
                //check price precision
                let percision_price = get_precision(form.elements.source_asset.value+"/"+form.elements.target_asset.value)['price']
                //check if after make the precision the price will be zero or not if it will be zero that is wrong
                if(percision_price >= 1){
                    if(parseFloat(parseFloat(parseFloat(form.elements.amount2.value)).toFixed(percision_price)) == 0){
                        localStorage.setItem("wrong_precision","true")
                    }
                    else{
                        localStorage.setItem("wrong_precision","false")
                    }
                }
                else{
                    if(parseFloat(form.elements.amount2.value) < percision_price * 10){
                        localStorage.setItem("wrong_precision","true")
                    }
                    else{
                        localStorage.setItem("wrong_precision","false")
                    }
                }
            }
        }
    </script>
</html>
{% endblock %}
