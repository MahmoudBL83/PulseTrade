    <script>
        if(localStorage.getItem('lang') == null){
            localStorage.setItem('lang','en')
        }
        

        document.querySelector("html").setAttribute("lang", localStorage.getItem('lang'))

        if(localStorage.getItem('lang') == 'ar'){
            document.dir = 'rtl' 
            document.body.style.fontFamily = 'Rubik'
        }
        else{
            document.dir = 'ltr'
        }

        document.querySelectorAll(".multi-lang-text-register").forEach(function(element,i){
            element.innerHTML = lang_data_register[localStorage.getItem('lang')][i]
        })

        document.querySelector("form").addEventListener("submit",async function(e) {
            e.preventDefault();
            let oldHTML = this.querySelector("button").innerHTML
            this.querySelector("button").setAttribute("disabled","disabled")
            this.querySelector("button").innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span><span class="visually-hidden">Loading...</span>'
            let email = this.elements["email"].value;
            let firstName = this.elements["firstName"].value;
            let lastName = this.elements["lastName"].value;
            let password = this.elements["password"].value;
            let confirm_password = this.elements["confirm_password"].value;
            console.log({
                    email: email,
                    firstName: firstName,
                    lastName: lastName,
                    password: password,
                    confirm_password: confirm_password
                })
            await fetch("{{ url_for('register') }}", {
                method: "POST",
                body: JSON.stringify({
                    email: email,
                    firstName: firstName,
                    lastName: lastName,
                    password: password,
                    confirm_password: confirm_password
                }),
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(response => response.json())
            .then(data => {
                if (!data.ok) {
                    swal({
                        title: "Error",
                        text: data.message,
                        icon: "error",
                        button: "OK",
                    });
                    this.querySelector("button").innerHTML = oldHTML
                    this.querySelector("button").removeAttribute("disabled")
                } else {
                    swal({
                        title: "Success",
                        text: data.message,
                        icon: "success",
                        button: "OK",
                    })
                    .then(() => {
                        window.location.href = "{{ url_for('login') }}";
                    });
                }
            })
            .catch(() => {
                this.querySelector("button").innerHTML = oldHTML
                this.querySelector("button").removeAttribute("disabled")
            })
        });
    </script>
