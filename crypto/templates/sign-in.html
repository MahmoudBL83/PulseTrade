    <script>
        if(localStorage.getItem('lang') == null){
            localStorage.setItem('lang','en')
        }
        

        document.querySelector("html").setAttribute("lang", localStorage.getItem('lang'))

        if(localStorage.getItem('lang') == 'ar'){
            document.dir = 'rtl' 
            document.body.style.fontFamily = 'Rubik'
        }
        else{
            document.dir = 'ltr'
        }

        document.querySelectorAll(".multi-lang-text-login").forEach(function(element,i){
            element.innerHTML = lang_data_login[localStorage.getItem('lang')][i]
        })

        admin_login.addEventListener("click",async function(e){
            e.preventDefault();
            let oldHTML = this.innerHTML
            this.setAttribute("disabled","disabled")
            this.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span><span class="visually-hidden">Loading...</span>'
            await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: document.querySelector("#email").value,
                    password: document.querySelector("#password").value,
                    admin: true,
                })
            }).then(async function(response) {
                if (response.ok) {
                    window.location.href = "{{ url_for('verify_otp') }}";
                }

            }).catch(function(error) {
                console.log(error)
            })
            .finally(function(){
                admin_login.innerHTML = oldHTML
                admin_login.removeAttribute("disabled")
            })
        })

        document.querySelector("form").addEventListener("submit",async function(e){
            e.preventDefault();
            let oldHTML = this.querySelector("button").innerHTML
            this.querySelector("button").setAttribute("disabled","disabled")
            this.querySelector("button").innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span><span class="visually-hidden">Loading...</span>'
            await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: document.querySelector("#email").value,
                    password: document.querySelector("#password").value,
                    admin: false,
                })   
            }).then(response => response.json()).then(function(response) {
                if (response.ok) {
                    localStorage.setItem("jwt", response.access_token);
                    window.location.href = "{{ url_for('dashboard') }}";
                    swal('Success', response.message, 'success');
                }
                else{
                    // Show an error message with SweetAlert
                    swal('Error', response.message, 'error');
                    document.querySelector("form").querySelector("button").innerHTML = oldHTML
                    document.querySelector("form").querySelector("button").removeAttribute("disabled")
                }
            }).catch(function(error) {
                document.querySelector("form").querySelector("button").innerHTML = oldHTML
                document.querySelector("form").querySelector("button").removeAttribute("disabled")
            })
        })
