



<!doctype html>
<html lang="en" >
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js"></script>
    <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js"></script>
      <title>PulseTrade | Sign in</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100;200;300;400;500;600;700;800;900&family=Cairo:wght@200;300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
      <!-- Favicon -->
      <link rel="shortcut icon" href="/static/images/logo2.png" />
      <link rel="stylesheet" href="/static/assets/css/libs.min.css">
      <link rel="stylesheet" href="/static/assets/css/coinex.css?v=1.0.0">  
      <style>
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-background-clip: text;
            -webkit-text-fill-color: white;
            transition: background-color 5000s ease-in-out 0s;
            box-shadow: inset 0 0 20px 20px #23232329;
            color: white!important;
        }

        .loader.simple-loader .loader-body {
            background-image: url(/static/images/logo.gif);
        }

        .swal-modal{
            background: #3b3b3b70;
            -webkit-backdrop-filter: blur(30px);
            backdrop-filter: blur(30px);
        }

        .swal-text,.swal-title{
            color:white;
        }

        .swal-button{
            color: #fff;
            background-color: #FF971D;
            border-color: #FF971D;
            box-shadow: 0 0px 0px 0 rgba(0, 0, 0, 0);
            box-shadow: 0 0.125rem 0.25rem rgba(255, 151, 29, 0.3);
        }

        .swal-button:not([disabled]):hover{
            background-color: transparent!important;
            border-color: #FF971D;
        }

        input{
            background: transparent!important;
        }

        html[dir="rtl"] .form-floating label {
            right: 0;
            left: auto;
        }
      </style>
     </head>
  <body class="" data-bs-spy="scroll" data-bs-target="#elements-section" data-bs-offset="0" tabindex="0">
    <!-- loader Start -->
    <div id="loading">
      <div class="loader simple-loader">
          <div class="loader-body"></div>
      </div>    </div>
    <!-- loader END -->
    <div style="background-repeat: no-repeat;background-size: cover;" >  
      <img src="/static/images/Hexagon.png" style="position: fixed;top:0;
      left: 0;width: fit-content;height: 100%;filter: grayscale(1);min-height: 100%;min-width: 100%;opacity: 0.2;">
        <div class="wrapper">
<section class="vh-100 bg-image">
    <div class="container h-100">
        <div class="row justify-content-center h-100 align-items-center">
            <div class="col-md-5 mt-5">
                <div class="card">
                    <div class="card-body">
                         <div class="auth-form">
                          <form method="POST">
                            <div>
                                <h2>Reset Password</h2>
                            </div>
                            <div>
                                <p class="mt-3">Enter Your mail to receive the OTP Code to validate your self</p>
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" name="email" id="email_input">
                                    <label for="floatingInput">Email</label>
                                </div>
                            </div>
                            <div class="text-center" style="">
                                <button id="resetPassword" class="btn btn-primary btn-sm mt-3" style="width: 100%;
                                margin-bottom: 10px;">Send OTP</button>
                            </div>
                            <!--small class="form-text text-muted text-center">Didn't receive the OTP? <a href="{{ url_for('resend_otp') }}">Resend OTP</a></small-->
                          </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
        </div>
      </div>
      
    
    <!-- Backend Bundle JavaScript -->
    <script src="/static/assets/js/libs.min.js"></script>
    <!-- widgetchart JavaScript -->
    <script src="/static/assets/js/charts/widgetcharts.js"></script>
    <!-- fslightbox JavaScript -->
    <script src="/static/assets/js/fslightbox.js"></script>
    <!-- app JavaScript -->
    <script src="/static/assets/js/app.js"></script>
    <!-- apexchart JavaScript -->
    <script src="/static/assets/js/charts/apexcharts.js"></script>

    <script>
      resetPassword.addEventListener("click",async function(evt){
        evt.preventDefault()
        let oldHTML = this.innerHTML
        this.setAttribute('disabled', 'disabled')
        this.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span><span class="visually-hidden">Loading...</span>'
        await fetch(`/reset_password`,{
          method: "POST",
          body: JSON.stringify({
            email: email_input.value
          }),
          headers: {
              'Content-Type': 'application/json'
          },
        }).then(res => res.json())
        .then(data => {
          if (data.ok) {
                swal("Password Changed", data.message, "success")
            }
            else {
                swal("Error", data.message, "error")
            }
        })
        .finally(() => {
          this.innerHTML = oldHTML
          this.removeAttribute('disabled')
        })
      })
    </script>
  </body>
</html>
