        @keyframes placeHolderShimmer {
            0% {
                -webkit-transform: translateZ(0);
                transform: translateZ(0);

            }

            }

        .card-skeleton {
            width: 100%;
            height: 440px;
            margin: 5px;
            position: relative;
            float: left;
            top: 0;
            left: 0;
            transition: all .3s ease-in-out;
            -webkit-backface-visibility: hidden;
            background: #202022;
            z-index: 10;
            padding: 15px;
            opacity: 1;
        }

        .card-skeleton.hidden {
            transition: all .3s ease-in-out;
            opacity: 0;
            height: 0;
            padding: 0
        }

        .card-skeleton-img {
            width: 100%;
            height: 120px;
            background: #ffffff14;
            display: block
        }

        .animated-background {
            will-change: transform;
            animation: placeHolderShimmer 1s linear infinite forwards;
            -webkit-backface-visibility: hidden;
            background: linear-gradient(90deg, #282828 8%, #313133 18%, #272729 33%);
            background-size: 800px 104px;
            height: 100%;
            position: relative
        }

/* ======================== */
/*   Tooltips               */
/* ======================== */
.tooltip {
  outline: none;
  color: inherit;
  position: relative;
  -webkit-font-smoothing: antialiased;
  /* webkit text rendering fix */
  cursor: help;
  border-bottom: 1px dotted;
  font-weight: normal !important;
}

.tooltip .tooltip-content {
  border-radius: 4px;
  position: absolute;
  color: #111;
  border: 1px solid #ddd;
  background: #f9f9f9;
  line-height: 1.6;
  font-weight: normal;
  font-size: 12px;

  padding: 15px;
  bottom: 36px;
  left: -10px;
  margin: 0 auto;
  z-index: 9999;
  width: 200px;
  -webkit-transform: translateY(10px);
      -ms-transform: translateY(10px);
          transform: translateY(10px);
  -webkit-transition: all 0.25s ease-in;
          transition: all 0.25s ease-in;
  box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.28);
  visibility: hidden;
  opacity: 0;
  display: block;
}

.tooltip .tooltip-content:before {
  content: "";
  position: absolute;
  bottom: -10px;
  left: 10%;
  width: 20px;
  height: 20px;
  background: #f9f9f9;
  box-shadow: 2px 2px 3px rgba(0, 0, 0, 0.2);
  -webkit-transform: rotate(45deg);
      -ms-transform: rotate(45deg);
          transform: rotate(45deg);
  z-index: 0;
}

.tooltip:hover span {
  opacity: 1;
  visibility: visible;
  -webkit-transform: translateY(0px);
      -ms-transform: translateY(0px);
          transform: translateY(0px);
}

}

        document.querySelectorAll(".buy_sell_lang").forEach(e=>{

                if(localStorage.getItem('lang') == 'ar')
                e.innerHTML = 'شراء'
                e.style = `color: var(--bs-success);`
            }

                e.innerHTML = 'بيع'
                e.style = `color: #c86b60;`
            }
        })

    document.querySelectorAll(".tIa2C").forEach(e=>{
        e.addEventListener('click',function(){
            if(!e.querySelector("svg").classList.contains("TsDpd")){
                e.closest(".card").querySelector(".card-body").classList.add("hidden")
                e.querySelector("svg").classList.add("TsDpd")
            }
            else{
                e.closest(".card").querySelector(".card-body").classList.remove("hidden")
                e.querySelector("svg").classList.remove("TsDpd")
            }
        })
    })
